<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Multiverse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://db.onlinewebfonts.com/c/dc0b2bf2eb1538767df118d65a2314ea?family=Trench-Thin" rel="stylesheet">
    <link rel="stylesheet" href="static/css/landing.css">
    <link rel="icon" type="image/png" href="static/favicon.png">
    <link rel="stylesheet" href="static/css/chat_widget.css">
</head>

<body>
    <canvas id="particle-canvas"></canvas>

    <div class="landing-container">
        <div class="quote-box">
            &ldquo;{{ config.landing_quote }}
            <span class="highlight">{{ config.landing_highlight|safe }}</span>&rdquo;
            <div class="author">{{ config.landing_author }}</div>
        </div>
        <div class="welcome-text">{{ config.landing_welcome }}</div>
        <a href="graph.html" class="enter-btn">Enter the Multiverse</a>
    </div>

    <script>
        (function initParticles() {
            const canvas = document.getElementById('particle-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let W, H;
            function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
            resize(); window.addEventListener('resize', resize);
            const particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5 + 0.5, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4, alpha: Math.random() * 0.4 + 0.1 });
            }
            function draw() {
                ctx.clearRect(0, 0, W, H);
                for (const p of particles) {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
                    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(160,120,255,${p.alpha})`; ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
    {% if config.chat_widget.enabled %}
    <div id="chat-widget-container"></div>
    <script src="static/js/chat_widget.js"></script>
    {% endif %}
</body>

</html>
