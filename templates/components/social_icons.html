{% load portfolio_extras %}
<div class="social-row">
    <a href="mailto:{{ config.social.email }}" class="social-link" title="Email" aria-label="Email">{% icon "mail" %}</a>
    <a href="{{ config.social.github }}" target="_blank" rel="noopener" class="social-link" title="GitHub" aria-label="GitHub">{% icon "github" %}</a>
    <a href="{{ config.social.linkedin }}" target="_blank" rel="noopener" class="social-link" title="LinkedIn" aria-label="LinkedIn">{% icon "linkedin" %}</a>
    <a href="{{ config.social.medium }}" target="_blank" rel="noopener" class="social-link" title="Medium" aria-label="Medium">{% icon "medium" %}</a>
    {% if config.social.orcid %}
    <a href="{{ config.social.orcid }}" target="_blank" rel="noopener" class="social-link" title="ORCID" aria-label="ORCID">{% icon "id-card" %}</a>
    {% endif %}
    {% if config.social.researchgate %}
    <a href="{{ config.social.researchgate }}" target="_blank" rel="noopener" class="social-link" title="ResearchGate" aria-label="ResearchGate">{% icon "microscope" %}</a>
    {% endif %}
</div>
