<!-- Graph View at the bottom -->
<div style="text-align: center; margin-top: 80px; margin-bottom: 20px;">
    <div style="font-size: 1.5rem; color: #e8e0ff; margin-bottom: 12px;">Explore the Graph</div>
    <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
        style="background: rgba(100, 60, 200, 0.2); border: 1px solid rgba(140, 100, 255, 0.3); color: rgba(200, 192, 232, 0.8); padding: 8px 24px; border-radius: 30px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.75rem; transition: all 0.3s; letter-spacing: 1.5px; text-transform: uppercase; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2);"
        onmouseover="this.style.background='rgba(140, 100, 255, 0.4)'; this.style.color='#fff'; this.style.transform='translateY(-2px)';"
        onmouseout="this.style.background='rgba(100, 60, 200, 0.2)'; this.style.color='rgba(200, 192, 232, 0.8)'; this.style.transform='translateY(0)';">↑ Back to Top</button>
</div>
<div id="graph-container"
    style="height: 70vh; width: 100vw; position: relative; left: 50%; right: 50%; margin-left: -50vw; margin-right: -50vw;">
</div>

<!-- Info Panel -->
<div id="info-panel">
    <span class="close-btn" onclick="document.getElementById('info-panel').style.display='none'">&times;</span>
    <h2 id="panel-title">Title</h2>
    <div id="panel-content">Content goes here...</div>
</div>

<!-- Instructions -->
<div id="instructions"
    style="position: relative; text-align: center; margin-bottom: 20px; color: rgba(255,255,255,0.4);">
    Drag to move &bull; Scroll to zoom &bull; Click nodes to explore
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"></script>
<script>
    const resumeData = {{ graph_data|tojson }};
    const activePage = "{{ active_page }}";
</script>
<script src="static/js/graph.js"></script>
