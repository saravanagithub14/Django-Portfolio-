<!-- Explore the graph: brings the background graph (components/graph_background.html) to the front -->
<div class="graph-section-head">
    <div class="graph-section-title">Explore the Graph</div>
    <p class="graph-section-sub">Everything on this site, as one interactive 3D map.</p>
    <div class="graph-section-actions">
        <button type="button" class="graph-explore-btn" data-graph-explore>Open the graph</button>
        <button type="button" class="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑ Back to Top</button>
    </div>
</div>
