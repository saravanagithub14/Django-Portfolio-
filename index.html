<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Multiverse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://db.onlinewebfonts.com/c/dc0b2bf2eb1538767df118d65a2314ea?family=Trench-Thin" rel="stylesheet">
    <style>
        body,
        html {
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #06040f;
            overflow: hidden;
            color: #c8c0e8;
            font-family: 'Inter', sans-serif;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .landing-container {
            text-align: center;
            z-index: 10;
            padding: 40px;
            max-width: 900px;
            animation: fadeIn 2s ease forwards;
        }

        .quote-box {
            font-size: 1.4rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: rgba(200, 192, 232, 0.8);
            font-style: italic;
            font-weight: 300;
            text-shadow: 0 0 20px rgba(140, 100, 255, 0.2);
            padding: 0 20px;
        }

        .highlight {
            color: #e8e0ff;
            font-weight: 600;
            text-shadow: 0 0 20px rgba(160, 120, 255, 0.6);
            display: block;
            margin-top: 10px;
            font-size: 1.8rem;
        }

        .author {
            margin-top: 20px;
            font-size: 1rem;
            color: rgba(140, 100, 255, 0.8);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-style: normal;
        }

        .welcome-text {
            font-family: 'Trench Thin', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: #fff;
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(120, 80, 255, 0.8);
            opacity: 0;
            animation: fadeUp 1s ease forwards 1.5s;
        }

        .enter-btn {
            display: inline-block;
            padding: 18px 46px;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 50px;
            background: linear-gradient(135deg, rgba(120, 80, 255, 0.5), rgba(80, 40, 180, 0.6));
            border: 1px solid rgba(160, 120, 255, 0.6);
            box-shadow: 0 0 35px rgba(120, 80, 255, 0.5);
            transition: all 0.4s ease;
            opacity: 0;
            animation: fadeUp 1s ease forwards 2.5s;
            position: relative;
            overflow: hidden;
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: skewX(-20deg);
            transition: all 0.7s ease;
        }

        .enter-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 0 50px rgba(140, 100, 255, 0.8);
            background: linear-gradient(135deg, rgba(140, 100, 255, 0.8), rgba(100, 60, 200, 0.9));
            border-color: rgba(200, 180, 255, 0.8);
        }

        .enter-btn:hover::before {
            left: 150%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width: 600px) {
            .welcome-text {
                font-size: 1.8rem;
            }

            .quote-box {
                font-size: 1.1rem;
            }

            .highlight {
                font-size: 1.3rem;
            }
        }
    </style>
    <link rel="stylesheet" href="chat_widget.css">
</head>

<body>
    <canvas id="particle-canvas"></canvas>

    <div class="landing-container">
        <div class="quote-box">
            "Once I asked ChatGPT to roast me and it told me:
            <span class="highlight">\"You don't have a career path,<br>but a career multiverse.\"</span>"
            <div class="author">— ChatGPT</div>
        </div>

        <div class="welcome-text">So here it is. Welcome to my Multiverse of Madness.</div>

        <a href="graph.html" class="enter-btn">Enter the Multiverse</a>
    </div>

    <script>
        (function initParticles() {
            const canvas = document.getElementById('particle-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const particles = [];
            const COUNT = 60;

            for (let i = 0; i < COUNT; i++) {
                particles.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 1.5 + 0.5,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    alpha: Math.random() * 0.4 + 0.1
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                for (const p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0) p.x = W;
                    if (p.x > W) p.x = 0;
                    if (p.y < 0) p.y = H;
                    if (p.y > H) p.y = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(160,120,255,${p.alpha})`;
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
    <div id="chat-widget-container"></div>
    <script src="chat_widget.js"></script>
</body>

</html>
