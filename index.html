<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saravana Perumal R. — Portfolio</title>
    <meta name="description"
        content="Interactive Obsidian-style graph portfolio of Saravana Perumal R. — Data Scientist, Educator, Researcher.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://db.onlinewebfonts.com/c/dc0b2bf2eb1538767df118d65a2314ea?family=Trench-Thin" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <!-- Loading Overlay -->
    <div id="loader">
        <div class="pulse-ring"></div>
        <div class="loader-text">loading graph</div>
    </div>

    <!-- Background floating particles -->
    <canvas id="particle-canvas"></canvas>

    <!-- Graph -->
    <div id="graph-container"></div>

    <!-- Info Panel -->
    <div id="info-panel">
        <span class="close-btn" onclick="document.getElementById('info-panel').style.display='none'">&times;</span>
        <h2 id="panel-title">Title</h2>
        <div id="panel-content">Content goes here...</div>
    </div>

    <!-- Forces Control Panel -->
    <div id="forces-panel">
        <div class="panel-section" id="display-section">
            <div class="section-header" onclick="this.parentElement.classList.toggle('open')">
                <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
                Display
            </div>
            <div class="section-body">
                <label>Animation speed
                    <input type="range" id="ctrl-anim-speed" min="0.1" max="3" step="0.1" value="0.5">
                </label>
            </div>
        </div>
        <div class="panel-section open" id="forces-section">
            <div class="section-header" onclick="this.parentElement.classList.toggle('open')">
                <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
                Forces
            </div>
            <div class="section-body">
                <label>Center force
                    <input type="range" id="ctrl-center" min="0" max="1" step="0.01" value="0.5">
                </label>
                <label>Repel force
                    <input type="range" id="ctrl-repel" min="0" max="1" step="0.01" value="0.5">
                </label>
                <label>Link force
                    <input type="range" id="ctrl-link-strength" min="0" max="1" step="0.01" value="0.9">
                </label>
                <label>Link distance
                    <input type="range" id="ctrl-link-distance" min="0" max="1" step="0.01" value="0.7">
                </label>
            </div>
        </div>
    </div>

    <!-- Instructions -->
    <div id="instructions">
        Drag to move &bull; Scroll to zoom &bull; Click nodes to explore
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
    <script src="snowfall.js"></script>
</body>

</html>
