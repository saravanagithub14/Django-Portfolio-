name: Update Instagram Reels

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update-reels:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install instaloader
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch Latest Reels
        run: python scripts/fetch_reels.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add users/default/data/gallery.json
          git commit -m "Automated: Update latest Instagram reels [skip ci]" || echo "No changes to commit"
          git push
